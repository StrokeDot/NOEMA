name: Windows verification and installer
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Supersede obsolete PR checks, but never cancel a main-branch release build.
concurrency:
  group: noema-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  # FAST GATE: no NSIS packaging on a pull request.
  # Every main-branch release must pass this job before the Windows build starts.
  verify:
    name: Fast code, book-data and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/noema-core -> target
          cache-on-failure: true
      - run: npm ci
      - name: Verify TypeScript and frontend build
        run: npm run build
      - name: Run UI unit tests
        run: npm test
      - name: Test book database, migrations and preservation
        run: npm run test:core
      - name: Install Chromium and Linux browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Test book library, dialogue and writing in the browser
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: NOEMA-fast-test-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # RELEASE GATE: run only on main or explicit manual dispatch.
  # The existing filename is required by the NOEMA updater's discovery API.
  windows:
    name: Build and upgrade-test the Windows installer
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            crates/noema-core -> target
          cache-on-failure: true
      - run: npm ci
      - name: Verify authenticated GitHub update artifact download
        run: node scripts/update-download-smoke.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Remove cached NSIS installers before building
        shell: pwsh
        run: |
          $nsis = "src-tauri/target/release/bundle/nsis"
          if (Test-Path $nsis) {
            Get-ChildItem -Path $nsis -Filter "*.exe" -File | Remove-Item -Force
          }
      # Tauri builds the frontend itself via beforeBuildCommand; no redundant
      # frontend compilation, core tests or browser tests in the release job.
      - name: Build Windows NSIS installer
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: NOEMA-0.1.12-Windows-installer
          path: src-tauri/target/release/bundle/nsis/NOEMA_0.1.12_x64-setup.exe
          if-no-files-found: error
      - name: Download previously verified 0.1.0 installer for upgrade testing
        uses: actions/download-artifact@v4
        with:
          name: NOEMA-0.1-Windows-installer
          run-id: 38858899633
          github-token: ${{ github.token }}
          path: baseline-installer
      - name: Install, upgrade and reopen Windows app; preserve manuscripts
        run: node scripts/windows-smoke.mjs
        env:
          NOEMA_BASELINE_DIR: ${{ github.workspace }}/baseline-installer
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NOEMA-Windows-verification
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
