name: Windows verification and installer
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            src-tauri/target
            crates/noema-core/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock', 'crates/noema-core/Cargo.lock') }}
          restore-keys: windows-rust-
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:core
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Verify authenticated GitHub update artifact download
        run: node scripts/update-download-smoke.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Remove stale NSIS installers restored from Rust build cache
        shell: pwsh
        run: |
          $nsis = "src-tauri/target/release/bundle/nsis"
          if (Test-Path $nsis) {
            Get-ChildItem -Path $nsis -Filter "*.exe" -File | Remove-Item -Force
          }
      - run: npm run tauri build
      - uses: actions/cache/save@v4
        if: steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            src-tauri/target
            crates/noema-core/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: NOEMA-0.1.6-Windows-installer
          path: src-tauri/target/release/bundle/nsis/NOEMA_0.1.6_x64-setup.exe
          if-no-files-found: error
      - name: Download previously verified 0.1.0 installer for upgrade testing
        uses: actions/download-artifact@v4
        with:
          name: NOEMA-0.1-Windows-installer
          run-id: 38858899633
          github-token: ${{ github.token }}
          path: baseline-installer
      - name: Install, upgrade, and reopen the Windows application
        run: node scripts/windows-smoke.mjs
        env:
          NOEMA_BASELINE_DIR: ${{ github.workspace }}/baseline-installer
        timeout-minutes: 5
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NOEMA-Windows-verification
          path: test-results/
          if-no-files-found: warn
