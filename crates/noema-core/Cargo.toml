[package]
name = "noema-core"
version = "0.1.0"
edition = "2021"
[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
pdf-extract = "0.12.1"
quick-xml = "0.38"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
